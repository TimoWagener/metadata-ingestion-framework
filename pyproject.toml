[project]
name = "metadata-ingestion-framework"
version = "0.1.0"
description = "Declarative metadata compilation framework for automated data platform ingestion."
readme = "README.md"
authors = [
    { name = "Timo Wagener", email = "timowagener@hotmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.2",
]

[project.scripts]
metadata-ingestion-framework = "metadata_ingestion_framework:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
