# Example table / endpoint metadata configuration for landing zone ingestion
# -----------------------------------------------------------------------------------------
# Reference SQL Translation (e.g. DB2 / SQL Server / Oracle):
#
# -- 1. Full Load:
# SELECT COL_1, COL_2, COL_3 FROM SCHEMA.TABLE_NAME WHERE status = 'ACTIVE';
#
# -- 2. Incremental Overlap (watermark from state file, minus overlap window):
# SELECT COL_1, COL_2, COL_3 FROM SCHEMA.TABLE_NAME
# WHERE status = 'ACTIVE' AND updatedAt >= :watermark_date;
#
# -- 3. Incremental Append (watermark from state file, no overlap):
# SELECT COL_1, COL_2, COL_3 FROM SCHEMA.TABLE_NAME
# WHERE status = 'ACTIVE' AND eventTimestamp >= :watermark_date;
#
# -- 4. Bounded Full Load (rolling boundary window):
# SELECT COL_1, COL_2, COL_3 FROM SCHEMA.TABLE_NAME
# WHERE status = 'ACTIVE' AND orderDate >= :boundary_date;
#
# -- 5. Initial Load (one-off historical backfill):
# SELECT COL_1, COL_2, COL_3 FROM SCHEMA.TABLE_NAME
# WHERE status = 'ACTIVE' AND orderDate >= :boundary_date;  -- e.g. 3 calendar years
# -----------------------------------------------------------------------------------------

table:
  name: TABLE_NAME # Table name or entity name (e.g. OSBSTD, contacts, orders)
  endpoint: "/contacts" # Optional: REST/SOAP endpoint path (for API sources)
  response_path: "results" # Optional: JSON path to data array in API response (e.g. 'data', 'items', 'results')

  schema: CUSTOM_SCHEMA # Optional: override the default schema from _source.yml
  # custom_query: "SELECT col1, col2 FROM TABLE WHERE ..." # Optional: custom extraction SQL for DB sources

  primary_key: [ID_COL_1, ID_COL_2] # Composite or single primary key columns

  # Optional column subset. Omit to select all columns / extract all JSON fields
  columns: [
    COL_1, COL_2, COL_3
  ]

  # Optional static filters / query params applied at extract time
  filters:
    - "status = 'ACTIVE'"

  # Optional table-level pagination override (if different from source defaults)
  # pagination:
  #   type: cursor
  #   cursor_param: "after"
  #   cursor_path: "paging.next.after"
  #   page_size: 100

  # Load types define HOW data can be extracted from this table.
  # Subscriptions reference these keys by name. A 'full' load needs no entry
  # here — a subscription referencing 'full' without a loads entry implies a
  # plain full load. All watermark loads (incremental/append/bounded/initial)
  # MUST be declared below.
  loads:
    # Full Load (snapshot; soft-delete detection via snapshot diff against bronze)
    full: {}

    # Incremental Overlap (upsert - inserts & updates with lookback overlap window)
    incremental:
      watermark_column: updatedAt # Last modified timestamp column
      # Supported watermark_formats:
      #   - yyyyMMdd             (Integer date format: 20260831)
      #   - unix_ms              (Epoch timestamp in milliseconds: 1788216578000)
      watermark_format: unix_ms
      overlap_period: 3 days # Overlap window to catch delayed updates

    # Incremental Append (pure delta, no overlap - e.g. transaction logs)
    # append:
    #   watermark_column: eventTimestamp
    #   watermark_format: unix_ms

    # Bounded Full Load (soft-delete detection within a rolling boundary)
    # bounded:
    #   watermark_column: orderDate
    #   watermark_format: iso8601
    #   boundary_period: 1 calendar year

    # Initial Load (one-off historical backfill)
    # initial:
    #   watermark_column: orderDate
    #   watermark_format: iso8601
    #   boundary_period: 3 calendar years

  # Subscriptions connect load types to trigger cadences (reference only, no behavior).
  # Names become reusable trigger names in the trigger compiler (tr_ prefix added there).
  subscriptions:
    - name: daily_0300
      load: full
      # active: false # Optional: defaults to true

    - name: hourly
      load: incremental
