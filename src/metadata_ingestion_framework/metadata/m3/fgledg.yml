# Reference SQL (IBM DB2 for i / M3):
# -----------------------------------------------------------------------------------------
# -- Incremental Append (daily_0300):
# SELECT * FROM M3FDBPRD.FGLEDG
# WHERE EGCONO = 1
#   AND EGLMDT >= :watermark_date
# WITH UR;
#
# -- Bounded Full Load (weekly_sunday_1100):
# SELECT * FROM M3FDBPRD.FGLEDG
# WHERE EGCONO = 1
#   AND EGACDT >= :boundary_date   -- e.g. 1 calendar year boundary
# WITH UR;
#
# -- Initial Load (one-off backfill):
# SELECT * FROM M3FDBPRD.FGLEDG
# WHERE EGCONO = 1
#   AND EGACDT >= :boundary_date   -- e.g. 5 calendar years backfill
# WITH UR;
# -----------------------------------------------------------------------------------------

table:
  name: FGLEDG
  primary_key: [EGCONO, EGDIVI, EGYEA4, EGJRNO, EGJSNO]
  filters:
    - "EGCONO = 1"
  loads:
    append:
      watermark_column: EGLMDT
      watermark_format: yyyyMMdd
    bounded:
      watermark_column: EGACDT
      watermark_format: yyyyMMdd
      boundary_period: 1 calendar year
    initial:
      watermark_column: EGACDT
      watermark_format: yyyyMMdd
      boundary_period: 5 calendar years
  subscriptions:
    - name: daily_0300
      load: append
    - name: weekly_sunday_1100
      load: bounded
