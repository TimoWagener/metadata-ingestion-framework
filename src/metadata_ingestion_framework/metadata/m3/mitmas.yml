# Reference SQL (IBM DB2 for i / M3):
# -----------------------------------------------------------------------------------------
# -- Full Load (daily_0300):
# SELECT * FROM M3FDBPRD.MITMAS
# WHERE MMCONO = 1
# WITH UR;
# -----------------------------------------------------------------------------------------

table:
  name: MITMAS
  primary_key: [MMCONO, MMITNO]
  filters:
    - "MMCONO = 1"
  loads:
    full: {}
  subscriptions:
    - name: daily_0300
      load: full
