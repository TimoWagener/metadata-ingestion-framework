# Reference SQL (IBM DB2 for i / M3):
# -----------------------------------------------------------------------------------------
# -- Incremental Overlap (daily_0300):
# SELECT * FROM M3FDBPRD.OCUSAD
# WHERE OPCONO = 1
#   AND OPLMTS >= :watermark_date  -- unix_ms minus 2 hours
# WITH UR;
#
# -- Bounded Full Load (weekly_sunday_1100):
# SELECT * FROM M3FDBPRD.OCUSAD
# WHERE OPCONO = 1
#   AND OPRGDT >= :boundary_date  -- e.g. 20260101
# WITH UR;
# -----------------------------------------------------------------------------------------

table:
  name: OCUSAD
  primary_key: [OPCONO, OPCUNO, OPADRT, OPADID]
  filters:
    - "OPCONO = 1"
  loads:
    incremental:
      watermark_column: OPLMTS
      watermark_format: unix_ms
      overlap_period: 2 hours
    bounded:
      watermark_column: OPRGDT
      watermark_format: yyyyMMdd
      boundary_period: 1 calendar year
  subscriptions:
    - name: daily_0300
      load: incremental
    - name: weekly_sunday_1100
      load: bounded
