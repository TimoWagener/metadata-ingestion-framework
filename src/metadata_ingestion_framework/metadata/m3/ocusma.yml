# Reference SQL (IBM DB2 for i / M3):
# -----------------------------------------------------------------------------------------
# -- Full Load (daily_0300):
# SELECT * FROM M3FDBPRD.OCUSMA
# WHERE OKCONO = 1
# WITH UR;
# -----------------------------------------------------------------------------------------

table:
  name: OCUSMA
  primary_key: [OKCONO, OKCUNO]
  filters:
    - "OKCONO = 1"
  loads:
    full: {}
  subscriptions:
    - name: daily_0300
      load: full
