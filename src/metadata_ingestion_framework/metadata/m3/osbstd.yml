# Reference SQL (IBM DB2 for i / M3):
# -----------------------------------------------------------------------------------------
# -- Incremental Overlap (daily_0300):
# SELECT UCCONO, UCDIVI, ... FROM M3FDBPRD.OSBSTD
# WHERE UCCONO = 1 AND UCDIVI IN (...)
#   AND UCLMDT >= :watermark_date   -- e.g. max(state) minus 3 days
# WITH UR;
#
# -- Bounded Full Load (weekly_sunday_1100):
# SELECT UCCONO, UCDIVI, ... FROM M3FDBPRD.OSBSTD
# WHERE UCCONO = 1 AND UCDIVI IN (...)
#   AND UCACDT >= :boundary_date    -- e.g. 1 calendar year boundary
# WITH UR;
#
# -- Initial Load (one-off backfill, no state file yet):
# SELECT UCCONO, UCDIVI, ... FROM M3FDBPRD.OSBSTD
# WHERE UCCONO = 1 AND UCDIVI IN (...)
#   AND UCACDT >= :boundary_date    -- e.g. 3 calendar years
# WITH UR;
# -----------------------------------------------------------------------------------------

table:
  name: OSBSTD
  primary_key: [UCCONO, UCDIVI, UCORNO, UCDLIX, UCWHLO, UCPONR, UCPOSX, UCORIG]
  columns: [
    UCCONO, UCDIVI, UCORNO, UCDLIX, UCWHLO, UCPONR, UCPOSX, UCORIG, UCIVNO, UCIVDT,
    UCYEA4, UCACDT, UCCUNO, UCITNO, UCSUNO, UCRSCD, UCIVQT, UCIVQA, UCSAAM, UCDIA1,
    UCDIA2, UCDIA3, UCDIA4, UCDIA5, UCDIA6, UCDCOS, UCLMDT, UCPCLA, UCRSC1
  ]
  filters:
    - "UCCONO = 1"
    - "UCDIVI IN ('DTC', 'REN', 'GEV', 'GAF', 'OMI', 'RLA')"
  loads:
    incremental:
      watermark_column: UCLMDT
      watermark_format: yyyyMMdd
      overlap_period: 3 days
    bounded:
      watermark_column: UCACDT
      watermark_format: yyyyMMdd
      boundary_period: 1 calendar year
    initial:
      watermark_column: UCACDT
      watermark_format: yyyyMMdd
      boundary_period: 3 calendar years # invoked ad-hoc (no schedule), not referenced by a subscription
  subscriptions:
    - name: daily_0300
      load: incremental
    - name: weekly_sunday_1100
      load: bounded
